version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 14
    groups:
      pip:
        patterns:
          - '*'
      pip-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/briefings'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns:
          - '*'
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
