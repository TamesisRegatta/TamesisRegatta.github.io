name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No pip cache: a cache restored into a publishing workflow could be poisoned.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium (for PDF generation)
        run: playwright install --with-deps chromium

      - name: Build site with PDFs
        run: mkdocs build --strict
        env:
          PDF_EXPORT: "true"
          # Personal contact details are stored as repository secrets, never
          # in the repo itself. Unset secrets render as "[withheld]".
          PHONE_FERGUS_COOPER: ${{ secrets.PHONE_FERGUS_COOPER }}
          PHONE_SYDNEY_ROSE: ${{ secrets.PHONE_SYDNEY_ROSE }}
          PHONE_JOE_HITCHEN: ${{ secrets.PHONE_JOE_HITCHEN }}
          PHONE_DAVID_SEALE: ${{ secrets.PHONE_DAVID_SEALE }}
          EMAIL_SYDNEY_ROSE: ${{ secrets.EMAIL_SYDNEY_ROSE }}
          EMAIL_DAVID_SEALE: ${{ secrets.EMAIL_DAVID_SEALE }}
          PHONE_CHCH_LODGE: ${{ secrets.PHONE_CHCH_LODGE }}
          PHONE_RIVERSIDE_CENTRE: ${{ secrets.PHONE_RIVERSIDE_CENTRE }}
          PHONE_CITY_OF_OXFORD_RC: ${{ secrets.PHONE_CITY_OF_OXFORD_RC }}
          PHONE_EA_DUTY_OFFICER: ${{ secrets.PHONE_EA_DUTY_OFFICER }}
          PHONE_EA_INCIDENT_LINE: ${{ secrets.PHONE_EA_INCIDENT_LINE }}
          PHONE_IFFLEY_LOCK: ${{ secrets.PHONE_IFFLEY_LOCK }}
          PHONE_UNIVERSITY_SECURITY: ${{ secrets.PHONE_UNIVERSITY_SECURITY }}
          PHONE_PRESS_OFFICE: ${{ secrets.PHONE_PRESS_OFFICE }}
          PHONE_EPIONE_MEDICAL: ${{ secrets.PHONE_EPIONE_MEDICAL }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # publish the uploaded site
      id-token: write # deploy-pages proves the deployment's origin with an OIDC token

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
