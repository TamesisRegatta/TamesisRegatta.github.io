name: Build and deploy site

# Every pull request gets the same build and checks as a deploy, so it is
# tested exactly as it would be published; only main is deployed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Deploys share one group, so a newer push replaces an older one; each pull
# request has its own, so checks and deploys never cancel each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No pip cache: a cache restored into a publishing workflow could be poisoned.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium (for PDF generation)
        run: playwright install --with-deps chromium

      - name: Build site with PDFs
        run: mkdocs build --strict
        env:
          PDF_EXPORT: "true"

      # The briefing slides (briefings/), built into site/briefings/ after
      # mkdocs, which clears site/ first.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: briefings/.nvmrc
          # No npm cache, for the same reason as no pip cache above.
          package-manager-cache: false

      - name: Install briefing dependencies
        working-directory: briefings
        run: npm ci

      # Slidev's PDF export uses the npm Playwright, which needs its own
      # Chromium; the system libraries came with the Python one above.
      - name: Install Chromium for the briefing PDFs
        working-directory: briefings
        run: npx playwright install chromium

      - name: Build briefing slides with PDFs
        run: briefings/build.sh

      # Accessibility, privacy and the PDFs, on the built site (see "Automated
      # checks" in the README). axe-core comes from the briefings' npm install.
      - name: Check the site
        run: python tests/check_site.py site briefings/node_modules/axe-core/axe.min.js

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # publish the uploaded site
      id-token: write # deploy-pages proves the deployment's origin with an OIDC token

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
