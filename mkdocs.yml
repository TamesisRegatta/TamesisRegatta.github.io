site_name: Tamesis Regatta by Linacre Boat Club
site_url: https://tamesisregatta.org/
site_description: Rules, event plan and safety documents for Tamesis Regatta
repo_url: https://github.com/TamesisRegatta/TamesisRegatta.github.io
repo_name: TamesisRegatta
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Rules: rules.md
  - Event Plan: event-plan.md
  - Risk Assessment: risk-assessment.md
  - Course Map: map.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/img/tamesis_logo.svg
  favicon: assets/img/favicon.svg
  # No Google Fonts: Noto Sans is self-hosted, see the top of extra.css.
  font: false
  icon:
    edit: material/pencil
    view: material/eye
    admonition:
      # "success" is otherwise unused on the site, so this only affects the
      # "Controls" dropdowns on the risk assessment page.
      success: material/checkbox-marked-outline
  palette:
    # "custom" opts out of Material's named palette so the actual colours
    # come from the --md-primary-*/--md-accent-* variables defined per
    # scheme in extra.css (see the "Brand palette" block there).
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.action.edit
    - content.action.view
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - attr_list
  - admonition
  - def_list
  - md_in_html
  - pymdownx.details
  # Icon shortcodes such as :material-flag:, drawn as inline SVG from the
  # icons bundled with Material: no font or CDN needed, so they render in
  # the PDF export too. Only use bundled icon sets (material-, octicons-,
  # fontawesome-, simple-): plain emoji shortcodes load images from a CDN.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_css:
  - assets/extra.css
extra_javascript:
  - assets/anchors.js
  - assets/contacts.js
  - assets/risk-summary.js
  - assets/map.js

hooks:
  # Replaces the course map page's PDF with one page per map, each sized to
  # its map, after mkdocs-exporter has run.
  - hooks/map_pdf.py
  # Stops mkdocs-exporter turning mailto: links into broken site URLs in PDFs.
  - hooks/pdf_links.py

plugins:
  - search
  - macros:
      include_yaml:
        # Top-level keys of event.yml (dates, contact, roles) become template
        # variables: {{ dates.entries_close }}, {{ roles.chief_marshal.name }}
        - event.yml
        # Namespaced, so risk_matrix.yml's own top-level keys (severity,
        # levels, etc.) can't collide with anything else: {{ risk_matrix.* }}
        - risk_matrix: risk_matrix.yml
  - exporter:
      formats:
        pdf:
          # PDF generation needs Playwright + Chromium and slows down builds, so
          # it is off by default for local work. CI sets PDF_EXPORT=true.
          enabled: !ENV [PDF_EXPORT, false]
          concurrency: 4
      buttons:
        - title: Download as PDF
          icon: !!python/name:mkdocs_exporter.formats.pdf.buttons.download.icon
          enabled: !!python/name:mkdocs_exporter.formats.pdf.buttons.download.enabled
          attributes: !!python/name:mkdocs_exporter.formats.pdf.buttons.download.attributes
