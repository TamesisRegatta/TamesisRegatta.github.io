site_name: Tamesis Regatta by Linacre Boat Club
site_url: https://tamesisregatta.org/
site_description: Rules, event plan and safety documents for Tamesis Regatta
repo_url: https://github.com/TamesisRegatta/TamesisRegatta.github.io
repo_name: TamesisRegatta
edit_uri: edit/main/docs/

# Pages for crews and captains first, then the safety documents, then past
# regattas. extra.css marks off the last two sections with a "Safety
# documents" divider just before Event Plan and a "Past regattas" divider
# just before History (keep each straight after Briefings and River Notices
# respectively). The Draw entry is added after Home by hooks/draw_redirect.py.
# Each page sets its nav icon in its front matter (icon: material/...).
nav:
  - Home: index.md
  - Course Map: map.md
  - Rules: rules.md
  - FAQs: faqs.md
  - Briefings: briefings.md
  - Event Plan: event-plan.md
  - Risk Assessment: risk-assessment.md
  - River Notices: river-notices.md
  - History: history.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/img/tamesis_logo.svg
  favicon: assets/img/favicon.svg
  # No Google Fonts: Noto Sans is self-hosted, see the top of extra.css.
  font: false
  icon:
    edit: material/pencil
    view: material/eye
    admonition:
      # "success" is otherwise unused on the site, so this only affects the
      # "Controls" dropdowns on the risk assessment page.
      success: material/checkbox-marked-outline
  palette:
    # "custom" opts out of Material's named palette so the actual colours
    # come from the --md-primary-*/--md-accent-* variables defined per
    # scheme in extra.css (see the "Brand palette" block there).
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.action.edit
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - attr_list
  - admonition
  - def_list
  - md_in_html
  - pymdownx.details
  # Icon shortcodes such as :material-flag:, drawn as inline SVG from the
  # icons bundled with Material: no font or CDN needed, so they render in
  # the PDF export too. Only use bundled icon sets (material-, octicons-,
  # fontawesome-, simple-): plain emoji shortcodes load images from a CDN.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_css:
  - assets/extra.css
extra_javascript:
  - assets/anchors.js
  - assets/contacts.js
  - assets/risk-summary.js
  - assets/key-dates.js
  - assets/map.js
  - assets/draw-link.js
  - assets/analytics.js

hooks:
  # Replaces the course map page's PDF with one page per map, each sized to
  # its map, after mkdocs-exporter has run.
  - hooks/map_pdf.py
  # Stops mkdocs-exporter turning mailto: links into broken site URLs in PDFs.
  - hooks/pdf_links.py
  # Makes the PDFs accessible: tagged, with their language and bookmarks.
  - hooks/pdf_tagged.py
  # Serves /draw/ as a short link to draw_url in event.yml, once it is set,
  # and adds a Draw entry to the nav after Home.
  - hooks/draw_redirect.py

extra:
  # No "Made with Material for MkDocs" in the footer.
  generator: false
  # Plausible Analytics, on Oxford Research Software Engineering's server
  # (see "Privacy" in the README). script: the site's own script, which
  # overrides/main.html puts in every page; its settings (counting PDF
  # downloads and links to other sites) are made on the server. dashboard: the
  # dashboard's shared link, which the analytics page embeds.
  plausible:
    script: https://plausible-oxrse.fly.dev/js/pa-PwXVTc5jYDF32-gGeAIHT.js
    embed_script: https://plausible-oxrse.fly.dev/js/embed.host.js
    dashboard: https://plausible-oxrse.fly.dev/share/tamesisregatta.org?auth=wocsFySJ9DCk-Bm52bdZP

# The footer's links to the accessibility statement, privacy policy and
# analytics page, which are not in the nav.
copyright: '<a href="/accessibility/">Accessibility</a> &middot; <a href="/privacy/">Privacy policy</a> &middot; <a href="/analytics/">Analytics</a>'

plugins:
  - search
  - macros:
      include_yaml:
        # Top-level keys of event.yml (dates, contact, roles) become template
        # variables: {{ dates.entries_close }}, {{ roles.chief_marshal.name }}
        - event.yml
        # Namespaced, so risk_matrix.yml's own top-level keys (severity,
        # levels, etc.) can't collide with anything else: {{ risk_matrix.* }}
        - risk_matrix: risk_matrix.yml
        # Past results, for the History page: {{ history.years }}
        - history: history.yml
        # The OURCs college clubs by code, for the History page's blade badges
        - clubs: clubs.yml
  - exporter:
      formats:
        pdf:
          # PDF generation needs Playwright + Chromium and slows down builds, so
          # it is off by default for local work. CI sets PDF_EXPORT=true.
          enabled: !ENV [PDF_EXPORT, false]
          concurrency: 4
      buttons:
        - title: Download as PDF
          icon: !!python/name:mkdocs_exporter.formats.pdf.buttons.download.icon
          enabled: !!python/name:mkdocs_exporter.formats.pdf.buttons.download.enabled
          attributes: !!python/name:mkdocs_exporter.formats.pdf.buttons.download.attributes
