  <g data-into="Circulation Arrows">
    <path d="M 848,243 C 925,246 988,258 1026,280" style="fill:none;stroke:#000fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:miter;stroke-dasharray:2, 4;marker-end:url(#marker19626-3-8)" data-label="Univ Landing Crossing" />
    <text style="font-size:12px;line-height:1.25;font-family:'Noto Sans',sans-serif;fill:#800000" data-label="Note Marshalling Zone">
      <tspan x="1372" y="140">Crews should spin upstream of Longbridges house</tspan>
      <tspan x="1372" y="155">into the Marshalling Zone, and then tuck in to the</tspan>
      <tspan x="1372" y="170">towpath while waiting for the division to start.</tspan>
      <tspan x="1372" y="200">Crews must not obstruct Isis Boathouse or</tspan>
      <tspan x="1372" y="215">Longbridges crews returning to their boathouse.</tspan>
    </text>
    <text style="font-size:12px;line-height:1.25;font-family:'Noto Sans',sans-serif;fill:#800000" data-label="Note Univ Boating">
      <tspan x="690" y="392">Crews from Univ Boathouse boat with bows pointing</tspan>
      <tspan x="690" y="407">downstream, pushing off and crossing immediately</tspan>
      <tspan x="690" y="422">between divisions under the direction of the Univ</tspan>
      <tspan x="690" y="437">Marshal.</tspan>
    </text>
    <text style="font-size:12px;line-height:1.25;font-family:'Noto Sans',sans-serif;fill:#800000" data-label="Note Univ Landing">
      <tspan x="1110" y="422">Crews landing at Univ Boathouse must wait near St</tspan>
      <tspan x="1110" y="437">John's Boathouse on the City side, and cross to land</tspan>
      <tspan x="1110" y="452">under instruction from the Crossing Marshal.</tspan>
      <tspan x="1110" y="482">Crews at Univ Boathouse must follow Marshal's</tspan>
      <tspan x="1110" y="497">directions when they are asked not to put their boat</tspan>
      <tspan x="1110" y="512">on the raft to make space for landing crews.</tspan>
    </text>
  </g>
